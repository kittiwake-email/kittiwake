# Development config: everything in one process on the in-memory backend.
# Data is lost when the process exits. Start with:
#   dovetail serve --config examples/dev.yaml --seed-account wido@example.org:devpassword
modes: [lmtp, api, postfix, imap, pop3, worker]
ceph:
  backend: memory
listen:
  lmtp:       {address: "127.0.0.1:2424", proxy_protocol: optional}
  imap:       {address: "127.0.0.1:1143", proxy_protocol: optional}
  pop3:       {address: "127.0.0.1:1110", proxy_protocol: optional}
  api:        {address: "127.0.0.1:8080", proxy_protocol: optional}
  postfix:    {address: "127.0.0.1:2525", proxy_protocol: off}
  management: {address: "127.0.0.1:9090", proxy_protocol: off}
smtp:
  relay_host: "127.0.0.1:1025"   # dev MTA (e.g. mailpit); sending fails until something listens here
session:
  issuer: http://127.0.0.1:8080
log:
  level: debug
  format: text
