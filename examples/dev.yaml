# Development config: everything in one process on the in-memory backend.
# Data is lost when the process exits. Start with:
#   kittiwake serve -c examples/dev.yaml --seed-account wido@example.org:devpassword
modes: [lmtp, jmap, admin, socketmap, imap, pop3, worker]
ceph:
  backend: memory
listen:
  # "optional" makes IMAP/POP3/LMTP wait briefly for a PROXY header before the banner;
  # use "off" for direct clients, "required" behind HAProxy.
  lmtp:       {address: "127.0.0.1:2424", proxy_protocol: off}
  imap:       {address: "127.0.0.1:1143", proxy_protocol: off}
  pop3:       {address: "127.0.0.1:1110", proxy_protocol: off}
  jmap:       {address: "127.0.0.1:8080", proxy_protocol: optional}
  admin:      {address: "127.0.0.1:8081", proxy_protocol: off}
  socketmap:    {address: "127.0.0.1:2525", proxy_protocol: off}
  management: {address: "127.0.0.1:9090", proxy_protocol: off}
smtp:
  relay_host: "127.0.0.1:1025"   # dev MTA (e.g. mailpit); sending fails until something listens here
session:
  issuer: http://127.0.0.1:8080
log:
  level: debug
  format: text
