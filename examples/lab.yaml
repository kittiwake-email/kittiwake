# Lab config (all modes in one process); the real lab is generated by kittiwake-labs.
modes: [lmtp, jmap, admin, postfix, imap, pop3, worker]
# Ceph client packages come from download.ceph.com; the cluster is reached
# through /etc/ceph/ceph.conf with the client.kittiwake keyring.
database:
  dsn: "kittiwake:kittiwake@unix(/run/mysqld/mysqld.sock)/kittiwake"   # MariaDB on the box (see ../kittiwake-labs)
ceph:
  backend: librados
  config_file: /etc/ceph/ceph.conf   # clusters are registered in the database (see ../kittiwake-labs)
listen:
  # "optional" makes IMAP/POP3/LMTP wait briefly for a PROXY header before the banner;
  # use "off" for direct clients, "required" behind HAProxy.
  lmtp:       {address: "[::1]:2424", proxy_protocol: off}
  imap:       {address: "[::1]:1143", proxy_protocol: off}
  pop3:       {address: "[::1]:1110", proxy_protocol: off}
  jmap:       {address: "[::1]:8080", proxy_protocol: optional}
  admin:      {address: "[::1]:8081", proxy_protocol: off}
  postfix:    {address: "[::1]:2525", proxy_protocol: off}
  management: {address: "[::1]:9090", proxy_protocol: off}
smtp:
  relay_host: "[::1]:1025"
session:
  issuer: http://[::1]:8080
export:
  directory: /var/lib/kittiwake/exports
log:
  level: info
  format: text
