# Kittiwake configuration. All keys shown with their defaults unless noted.
# Secrets may be given inline, as "file:/path", or with ${ENV_VAR} substitution.

# Modes this process runs, for the one-process form (development, small
# setups). Under systemd each instance passes its mode (kittiwake@<mode>
# runs `serve --modes <mode>`), so the line is left out there.
# modes: [lmtp, jmap, admin, socketmap]

# Metadata database (MariaDB 10.6+): domains, mailboxes, accounts, aliases,
# tokens, sessions, the worker queue and the Ceph cluster registry. Create or
# upgrade the schema with `kittiwake migrate -c <config>` before starting.
database:
  dsn: "kittiwake:${KITTIWAKE_DB_PASSWORD}@tcp(db.example.org:3306)/kittiwake"
  # Optional read replica for SELECT-only queries (a local MariaDB replicating
  # from the primary scales reads with the number of daemons). After a write
  # this process reads from the primary for read_stickiness so it sees its
  # own changes despite replication lag.
  # read_dsn: "kittiwake:${KITTIWAKE_DB_PASSWORD}@unix(/run/mysqld/mysqld.sock)/kittiwake"
  read_stickiness: 2s
  max_open_connections: 32
  max_idle_connections: 8
  connection_lifetime: 30m

# IMAP namespaces. Folders live in one personal namespace with "/" as delimiter.
# A compatibility namespace maps the same folders under an old layout so clients
# that were configured for Dovecot or Courier ("IMAP path prefix: INBOX") keep
# working after migration: "INBOX.Projects.2026" is "Projects/2026".
imap:
  compat_namespace:
    prefix: "INBOX."
    delimiter: "."

# Node registry: every process registers each mode it runs (address = advertise
# host + the mode's listener port) and refreshes it every heartbeat, so other
# daemons find e.g. search nodes and operators see what runs where
# (kittiwake-admin node list). Override advertise when the auto-detected
# address is not the one other nodes can reach.
node:
  # advertise: "2001:db8::10"   # or "198.51.100.10" or "mail1.example.org"
  heartbeat: 10s

# Ceph clusters are NOT configured here: they are registered in the database as storage
# (kittiwake-admin storage add --name ams1 --mon-host ... --user kittiwake --keyring ...
# --pools messages,attachments,index) and every daemon connects to all of them.
ceph:
  # Raw cluster headroom reserved from NEW mailbox placement (0..1).
  placement_reserve: 0.15
  backend: librados            # librados | memory (volatile, development only)
  # config_file: /etc/ceph/ceph.conf   # librados defaults applied to every storage connection
  # options: {ms_bind_ipv6: "true"}
  # pools: {messages: ..., attachments: ..., index: ..., meta: ...}   # memory backend only

listen:
  # One listener per mode, and per mode the management (metrics, health, /storage)
  # address of the process that runs it: the normal deployment is one systemd
  # instance per mode (kittiwake@<mode>), each needing its own management port.
  # listen.management is used by a process that runs several modes at once.
  # proxy_protocol: off | optional | required. HAProxy sends PROXY on every
  # connection it forwards; "required" refuses anything else, "optional" waits
  # briefly for a header, "off" is for listeners clients reach directly.
  lmtp:       {address: "[::]:24",    proxy_protocol: optional, management: "[::1]:9091"}
  imap:       {address: "[::]:143",   proxy_protocol: optional, management: "[::1]:9092"}
  pop3:       {address: "[::]:110",   proxy_protocol: optional, management: "[::1]:9093"}
  jmap:       {address: "[::]:8080",  proxy_protocol: optional, management: "[::1]:9094"}
  submission: {address: "[::]:587",   proxy_protocol: optional, management: "[::1]:9098"}   # SMTP submission; HAProxy terminates TLS on 465 (send-proxy-v2-ssl)
  admin:      {address: "[::1]:8081", proxy_protocol: off,      management: "[::1]:9095"}
  socketmap:  {address: "[::1]:2525", proxy_protocol: off,      management: "[::1]:9096"}   # MTA lookups (Postfix socketmap protocol)
  worker:     {management: "[::1]:9097"}                                                    # no listener of its own
  backup:     {management: "[::1]:9099"}                                                    # no listener of its own
  management: {address: "[::1]:9090"}                                                       # one-process form

proxy:
  trusted_addresses: []        # proxies whose X-Forwarded-For is trusted (HTTP fallback)

smtp:
  relay_host: "[::1]:25"       # outbound submissions go here (Postfix)
  tls: opportunistic           # off | opportunistic (STARTTLS when offered) | required (STARTTLS + verified certificate)
  # tls_server_name: mail.example.org   # certificate name when it differs from relay_host
  # tls_insecure_skip_verify: false     # required, but accept any certificate (lab relays)
  # username / password for SASL PLAIN (after STARTTLS)
  # xclient: false             # Postfix XCLIENT on every relay session: LOGIN=<account uuid> (sasl_username for
  #                             # policy services and logs), ADDR=<client address>. Needs smtpd_authorized_xclient_hosts
  #                             # on the relay; excludes username/password. Every message also carries
  #                             # X-Kittiwake-Account: <account uuid>.

submission:
  save_to_sent: false          # SMTP clients save their own Sent copy over IMAP
  require_tls_proxy: true      # offer AUTH only when the PROXY v2 header says the client used TLS (HAProxy send-proxy-v2-ssl)

mail:
  max_message_size: 52428800   # 50 MiB
  inline_attachment_max: 4096  # parts up to this size stay inline in the message document
  keep_raw: signed             # never | signed | always: keep original bytes (signed = PGP/MIME, S/MIME)
  trash_retention: 720h        # 30 days
  post_hold_grace: 168h        # 7 days after a hold is released before purges resume
  spam_header: X-Spam-Flag
  spam_value: "YES"
  over_quota_tempfail: false   # true: 4xx so the MTA retries (suspended mailboxes always 4xx, disabled always 5xx)
  max_alias_depth: 5

quota:                         # defaults for mailboxes without their own limits; 0 = unlimited
  soft_bytes: 0
  hard_bytes: 0
  soft_messages: 0
  hard_messages: 0

session:
  access_token_lifetime: 15m
  refresh_token_lifetime: 720h
  key_rotation_interval: 2160h
  issuer: https://mail.example.org   # also the JMAP base URL

cache:                         # per-process read caches; 0s disables one. Changes made by another
                               # process show within the TTL, own changes at once.
  credentials: 5s              # verified passwords / API tokens (basic auth = argon2id per request otherwise)
  identity: 5s                 # domains, mailboxes (state, hold, quota), accounts, aliases
  root: 5s                     # mailbox root (folders, counters, quota usage) where slightly stale is fine

audit:
  retention: 8760h             # 365 days
  detail: {}                   # per protocol: full (default) | session, e.g. {imap: session}

# Mailbox backups (see README "Backups"). The backup mode (kittiwake@backup) is
# the only process that needs the target and the keys; every other process only
# reads the schedule limits. Back up MariaDB (with binary logs) yourself: it is
# not covered here.
backup:
  target: s3                   # s3 | filesystem | "" (off; the backup mode refuses to start)
  s3:
    endpoint: https://s3.example.net   # any S3-compatible store; "http://[2a14:9b80::3144]:9000" for a lab MinIO
    region: us-east-1
    bucket: kittiwake-backups
    access_key: ${KITTIWAKE_S3_ACCESS_KEY}
    secret_key: ${KITTIWAKE_S3_SECRET_KEY}
    path_style: true           # bucket in the path (MinIO, RGW); false = virtual host (AWS)
  # directory: /var/lib/kittiwake/backups   # filesystem target instead of s3
  prefix: kittiwake/           # key prefix on the target
  # Pre-shared keys: 32 random bytes in hex (openssl rand -hex 32). The current key seals
  # new backups, every listed key opens old ones, so rotate by adding a key and moving
  # current_key. Losing every key means losing every backup: escrow them off the platform.
  keys:
    - {id: 1, key: "file:/etc/kittiwake/backup.key"}
  current_key: 1
  interval: 24h                # per-mailbox default; domains (settings backup.interval) and mailboxes override
  min_interval: 30m            # floor for every setting: lower intervals multiply the load on Ceph and the target
  max_interval: 720h           # 30 days
  retention: 2160h             # 90 days; runs older than this are deleted (never for mailboxes on hold)
  maintain_interval: 168h      # per-mailbox verification pass (presence, sampled content, strays)
  export_expiry: 168h          # export archives (unencrypted) are deleted after this
  lock: true                   # S3 Object Lock (compliance) for the retention period; ignored by targets without it
  pack_size: 1073741824        # 1 GiB per pack object
  blob_threshold: 1048576      # attachments from 1 MiB are stored once per content as blobs
  spool_dir: /var/lib/kittiwake/spool
  concurrency: 4               # tasks one backup process runs at once
  batch: 100                   # due mailboxes enqueued per scheduler tick

log:
  level: info                  # debug | info | warn | error
  format: json                 # json | text
